name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check native acceptance child environment
        run: go test -count=1 -v -run '^TestChildEnvironment' ./internal/nativecheck
      - name: Verify formatting, build, vet, static analysis, coverage, vulnerabilities
        run: go run ./cmd/verify
      - name: Race detection
        run: go test -race ./...
      - name: Exercise native Windows reparse-point boundaries
        if: runner.os == 'Windows'
        run: go test -count=1 -v -run '^TestWindowsReparse' ./internal/safeio ./internal/app ./internal/library
      - name: Exercise native Windows private decoder snapshot boundaries
        if: runner.os == 'Windows'
        run: go test -count=1 -v -run '^TestPCMFailureAndPrivateRevalidationNeverExposeCollectedBytes$|^TestMP4SnapshotRevalidationRejectsSameBytesFromDifferentNamedFile$' ./internal/content
      - name: Build and smoke-test native release binary
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -o bin/ ./cmd/nemalo
          ./bin/nemalo version --json
          ./bin/nemalo doctor --json
      - name: Exercise native executable lifecycle
        run: go run ./cmd/nativecheck --binary "bin/nemalo${{ runner.os == 'Windows' && '.exe' || '' }}" --commit "${{ github.sha }}"

  # Installers are exercised against the newest published release. They cannot
  # test an unpublished version, so release step 7 repeats this after publishing.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, pin, replace, and uninstall (sh)
        if: runner.os != 'Windows'
        shell: sh
        run: |
          set -eu
          dir="$RUNNER_TEMP/nemalo-bin"
          sh scripts/install.sh --dir "$dir"
          "$dir/nemalo" version
          sh scripts/install.sh --dir "$dir" --version 0.1.0-alpha.1
          test "$("$dir/nemalo" version)" = "0.1.0-alpha.1"
          sh scripts/install.sh --dir "$dir" --uninstall
          test ! -e "$dir/nemalo"
          if sh scripts/install.sh --dir "$dir" --version 0.0.0-missing; then exit 1; fi
          test ! -e "$dir/nemalo"
      - name: Install, pin, replace, and uninstall (PowerShell 7 and Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($host_ in @('pwsh', 'powershell')) {
            $dir = Join-Path $env:RUNNER_TEMP "nemalo-bin-$host_"
            $exe = Join-Path $dir 'nemalo.exe'
            & $host_ -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -Dir $dir -NoPath
            if ($LASTEXITCODE -ne 0) { throw "$host_ install failed" }
            & $exe version
            & $host_ -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -Dir $dir -Version 0.1.0-alpha.1 -NoPath
            if ((& $exe version) -ne '0.1.0-alpha.1') { throw "$host_ pinned version not installed" }
            & $host_ -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -Dir $dir -Uninstall
            if (Test-Path -LiteralPath $exe) { throw "$host_ uninstall left the executable" }
          }
