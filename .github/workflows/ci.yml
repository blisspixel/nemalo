name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify formatting, build, vet, static analysis, coverage, vulnerabilities
        run: go run ./cmd/verify
      - name: Race detection
        run: go test -race ./...
      - name: Build and smoke-test native release binary
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -o bin/ ./cmd/nemalo
          ./bin/nemalo version --json
          ./bin/nemalo doctor --json
